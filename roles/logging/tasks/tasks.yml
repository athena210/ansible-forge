---
- name: Check whether your OS is supported
  ansible.builtin.assert:
    quiet: true
    that:
      - ansible_os_family | lower in logging__os_supported | list
    fail_msg: Your OS is not supported

- name: Change journald.conf
  community.general.ini_file:
    dest: /etc/systemd/journald.conf
    section: Journal
    option: "{{ item.name }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop_control:
    label: "{{ item.name }}"
  loop:
    - name: Storage
      value: volatile
    - name: RuntimeMaxUse
      value: {{ logging__ram_size }}
    - name: SystemMaxUse
      value: {{ logging__disk_size }}
    - name: RuntimeMaxFileSize
      value: {{ logging__file_size }}
    - name: SystemMaxFileSize
      value: {{ logging__file_size }}

- name: Delete journald logs
  ansible.builtin.file:
    path: {{ item }}
    state: absent
  loop: [/var/log/journal, /run/log/journal]

- name: Restart journald
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    state: restarted
    name: systemd-journald.service


- name: Add rsyslogd and logrotate
  when: logging__install_rsyslogd
  block:
    - name: Install rsyslogd and logrotate with apt
      ansible.builtin.apt:
        update_cache: "{{ logging__pkg_cache_update }}"
        name: [rsyslog, logrotate]
      when: ansible_os_family | lower == "debian"

    - name: Upload configs
      ansible.builtin.copy:
        src: etc/
        dest: /etc/
        mode: "0644"
        directory_mode: "0755"

    - name: Restart services
      ansible.builtin.systemd_service:
        daemon_reload: true
        enabled: true
        state: restarted
        name: "{{ item }}"
      loop: [rsyslog.service, logrotate.service]

