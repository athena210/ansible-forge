---

- name: Check whether your OS is supported
  ansible.builtin.assert:
    quiet: true
    that:
      - ansible_os_family | lower in iptables__os_supported | list
    fail_msg: Your OS is not supported


- name: Upload files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dst }}"
    mode: "{{ item.mode }}"
    directory_mode: "0755"
  loop:
    - src: iptables.service
      dst: /etc/systemd/system/
      mode: "0644"
    - src: "{{ iptables__rules_file | default('filter.sh', true) }}"
      dst: /etc/iptables/
      mode: "0755"
  loop_control:
    label: "{{ item.src }}"


- name: Manage packages
  ansible.builtin.apt:
    name: "{{ item.packages }}"
    state: "{{ item.state }}"
    update_cache: "{{ iptables__force_update_repo }}"
  loop_control:
    label: "{{ item.name }}"
  loop:
    - name: Install
      state: present
      packages:
        - iptables
        - ipset
        - conntrack
    - name: Remove
      state: absent
      packages:
        - iptables-persistent
        - netfilter-persistent


- name: Restart iptables service
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    masked: false
    state: restarted
    name: "{{ item }}"
  loop: [iptables.service]
